spring:
  datasource:
    url: jdbc:h2:mem:task_manager_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

app:
  jwt:
    secret: test-only-signing-secret-with-more-than-32-bytes
    expiration-minutes: 15
  cors:
    allowed-origins: http://localhost:5173
